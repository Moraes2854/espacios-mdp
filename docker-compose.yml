services:
  postgres:
    image: postgres:16-alpine
    container_name: espacios-mdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: espacios_mdp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - espacios_mdp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d espacios_mdp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  espacios_mdp_postgres_data:
